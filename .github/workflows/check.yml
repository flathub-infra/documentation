name: Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 6.0.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check for self links
        run: |
          find ./docs -type f -exec awk '
            /docs\.flathub\.org\/docs/ {
              print "Error: Found docs.flathub.org/docs link in " FILENAME;
              exit 1
            }' {} +

      - name: Check for self link in blog authors
        run: |
          awk '
            /docs\.flathub\.org/ {
              print "Error: Found docs.flathub.org link in blog/authors.yml";
              exit 1
            }' blog/authors.yml

      - name: Check for HTTP links
        run: |
          find ./docs ./blog -type f ! -name "*.png" ! -name "*.svg" -exec awk '
            /http:\/\/[^\s]+/ {
              print "Error: Found HTTP link in " FILENAME;
              exit 1
            }' {} +

      - name: Set up Node.js
        # 6.4.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Get pnpm store directory path
        id: pnpm-store-path
        run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: ${{ steps.pnpm-store-path.outputs.dir }}
          key: ${{ runner.os }}-pnpm-check-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-check-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck
        run: pnpm typecheck

      - name: Build application
        run: pnpm build
        env:
          CI: true

  deploy-call:
    needs:
      - check
    permissions:
      pages: write
      id-token: write
      contents: read
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/deploy.yml
