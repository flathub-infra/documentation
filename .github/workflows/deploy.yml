name: Deploy

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      # 6.0.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Needed for sitemap generation with valid lastmod
          # https://github.com/facebook/docusaurus/pull/9954#issuecomment-2032900942
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        # 6.4.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Pages
        # 6.0.0
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Enable Corepack
        run: corepack enable

      - name: Get pnpm store directory path
        id: pnpm-store-path
        run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: ${{ steps.pnpm-store-path.outputs.dir }}
          key: ${{ runner.os }}-pnpm-deploy-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-deploy-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build website
        run: pnpm build

      - name: Upload artifact
        # 5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ./build

  deploy:
    needs:
      - build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # 5.0.0
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
