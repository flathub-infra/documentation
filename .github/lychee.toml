# Check source documents, including MDX and blog author URLs, but not assets.
extensions = ["md", "mdx", "html", "yml", "yaml"]

# Resolve root-relative routes to file URLs before scheme filtering. Lychee
# resolves this root against the working directory; do not set a base URL.
root_dir = "."
# Only check HTTP(S), so internal paths and anchors are not checked as files.
scheme = ["http", "https"]
include_verbatim = false
exclude_loopback = true

timeout = 30
max_retries = 3
retry_wait_time = 5
max_concurrency = 8
host_concurrency = 2
host_request_interval = "500ms"

# Each exclusion is a regular expression. Use TOML literal strings so that
# backslashes reach the regex unchanged. Do not skip whole hosting services
# or accept error statuses.
exclude = [
    # Reserved example domains used in verification and metainfo snippets.
    '^https?://(?:[^/]+\.)?example\.(?:com|org|net)(?::[0-9]+)?(?:[/?#]|$)',
    # Fictional project URLs in docs/02-for-app-authors/02-requirements.md.
    '^https?://github\.com/example-foo/bar/?(?:[?#].*)?$',
    '^https?://sourceforge\.net/projects/example-foo/?(?:[?#].*)?$',
    # Historical URL in the March 21, 2017 minutes. Now 404, with no verified relocation.
    '^https://github\.com/flatpak/flathub/?$',
    # Reddit blocks automated access to this comment in the June 19, 2017 minutes.
    '^https://www\.reddit\.com/r/linux_gaming/comments/6hzkz4/steam_is_now_available_as_a_flatpak/dj302av/?$',
]
